<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Маржинатор — отчёт</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1419);
      --card: var(--tg-theme-secondary-bg-color, #1a2332);
      --text: var(--tg-theme-text-color, #e7ecf3);
      --hint: var(--tg-theme-hint-color, #8b9bb4);
      --btn: var(--tg-theme-button-color, #2aabee);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --ok: #3dd68c;
      --bad: #f07178;
      --warn: #e6b450;
      --border: rgba(255,255,255,0.06);
      --radius: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px; line-height: 1.45;
      /* Важно: скролл только у body, не у вложенных overflow — меньше сворачиваний WebApp */
      overscroll-behavior-y: none;
      height: 100%;
    }
    body { padding: 12px 14px 32px; }
    .header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 14px;
    }
    .header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .header p { margin: 4px 0 0; color: var(--hint); font-size: 13px; }
    .pill {
      flex-shrink: 0; padding: 6px 10px; border-radius: 999px;
      background: rgba(42,171,238,0.15); color: var(--btn);
      font-size: 12px; font-weight: 600;
    }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
    }
    .card {
      background: var(--card); border-radius: var(--radius);
      padding: 14px; border: 1px solid var(--border);
    }
    .card .label { color: var(--hint); font-size: 12px; margin-bottom: 4px; }
    .card .value { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .card .value.ok { color: var(--ok); }
    .card .value.bad { color: var(--bad); }
    .section-title {
      font-size: 13px; font-weight: 600; color: var(--hint);
      text-transform: uppercase; letter-spacing: 0.04em;
      margin: 18px 0 10px;
    }
    .chart-wrap {
      background: var(--card); border-radius: var(--radius);
      padding: 14px; border: 1px solid var(--border); margin-bottom: 8px;
      height: 220px;
    }
    .list {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden;
    }
    .row {
      display: grid; grid-template-columns: 1fr auto;
      gap: 8px; padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }
    .row:last-child { border-bottom: none; }
    .row .name {
      font-weight: 600; font-size: 14px;
      overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .row .meta { color: var(--hint); font-size: 12px; margin-top: 2px; }
    .row .metrics { text-align: right; white-space: nowrap; }
    .row .profit { font-weight: 700; font-size: 14px; }
    .row .margin { font-size: 12px; color: var(--hint); }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 7px; border-radius: 6px; margin-top: 4px;
    }
    .badge.ok { background: rgba(61,214,140,0.15); color: var(--ok); }
    .badge.bad { background: rgba(240,113,120,0.15); color: var(--bad); }
    .badge.warn { background: rgba(230,180,80,0.15); color: var(--warn); }
    .empty {
      text-align: center; padding: 48px 20px;
    }
    .empty .ico { font-size: 40px; margin-bottom: 12px; }
    .empty h2 { margin: 0 0 8px; font-size: 17px; }
    .empty p { margin: 0 0 20px; color: var(--hint); font-size: 14px; line-height: 1.5; }
    .btn {
      display: inline-block; background: var(--btn); color: var(--btn-text);
      border: none; border-radius: 12px; padding: 12px 22px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .hint-box {
      background: var(--card); border-radius: var(--radius);
      padding: 12px 14px; border: 1px solid var(--border);
      color: var(--hint); font-size: 13px; margin-bottom: 14px; line-height: 1.5;
    }
    .loader {
      text-align: center; padding: 40px; color: var(--hint);
    }
    #app { max-width: 560px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="app">
    <div class="loader" id="loader">Загрузка отчёта…</div>
    <div id="empty" class="empty" style="display:none">
      <div class="ico">📊</div>
      <h2>Отчёт появится после расчёта</h2>
      <p>
        Mini App показывает <b>результаты</b> расчёта маржи по партии:<br/>
        выручка, прибыль, маржа и список товаров.<br/><br/>
        Отправьте боту прайс → настройте параметры → <b>/run</b>.<br/>
        Затем нажмите кнопку «Открыть интерактивный отчёт».
      </p>
      <button class="btn" type="button" onclick="closeApp()">Закрыть</button>
    </div>
    <div id="content" style="display:none"></div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      // Не сворачивать WebApp при скролле списка вверх
      try {
        if (typeof tg.disableVerticalSwipes === "function") {
          tg.disableVerticalSwipes();
        }
      } catch (e) {}
      try { tg.setHeaderColor("secondary_bg_color"); } catch (e) {}
      document.documentElement.style.setProperty("--bg", tg.themeParams.bg_color || "#0f1419");
      document.documentElement.style.setProperty("--card", tg.themeParams.secondary_bg_color || "#1a2332");
      document.documentElement.style.setProperty("--text", tg.themeParams.text_color || "#e7ecf3");
      document.documentElement.style.setProperty("--hint", tg.themeParams.hint_color || "#8b9bb4");
      document.documentElement.style.setProperty("--btn", tg.themeParams.button_color || "#2aabee");
    }

    function closeApp() {
      if (tg) tg.close();
    }

    function money(n) {
      const v = Number(n) || 0;
      return v.toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " ₽";
    }
    function pct(n) {
      const v = Number(n) || 0;
      return v.toFixed(1) + "%";
    }

    function getUploadId() {
      const q = new URLSearchParams(location.search);
      if (q.get("upload_id")) return q.get("upload_id");
      if (q.get("id")) return q.get("id");
      // hash #upload_id=123
      try {
        const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
        if (h.get("upload_id")) return h.get("upload_id");
      } catch (e) {}
      try {
        const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
        if (!sp) return null;
        if (/^\d+$/.test(sp)) return sp;
        const m = String(sp).match(/(\d+)/);
        if (m) return m[1];
      } catch (e) {}
      return null;
    }

    function apiBase() {
      // /app/... → origin; не использовать relative без leading slash к app
      return location.origin;
    }

    async function load() {
      const uploadId = getUploadId();
      const loader = document.getElementById("loader");
      const empty = document.getElementById("empty");
      const content = document.getElementById("content");

      if (!uploadId) {
        loader.style.display = "none";
        empty.style.display = "block";
        empty.querySelector("h2").textContent = "Нет ID расчёта";
        empty.querySelector("p").innerHTML =
          "Откройте Mini App <b>кнопкой «Отчёт»</b> из сообщения бота после расчёта.<br/>" +
          "В Amvera проверьте <code>WEB_APP_URL=https://ВАШ-хост/app</code>";
        return;
      }

      try {
        const headers = { "Accept": "application/json" };
        if (tg && tg.initData) {
          headers["X-Telegram-Init-Data"] = tg.initData;
        } else {
          throw new Error("Нет initData — откройте приложение из Telegram, не из браузера");
        }
        const url = apiBase() + "/api/upload/" + encodeURIComponent(uploadId);
        const res = await fetch(url, { headers, credentials: "same-origin" });
        let detail = "";
        try {
          const errBody = await res.clone().json();
          detail = errBody.detail || JSON.stringify(errBody);
        } catch (e) {
          detail = await res.text();
        }
        if (!res.ok) {
          throw new Error("HTTP " + res.status + (detail ? ": " + detail : ""));
        }
        const data = await res.json();
        render(data);
        loader.style.display = "none";
        content.style.display = "block";
      } catch (e) {
        loader.style.display = "none";
        empty.style.display = "block";
        empty.querySelector("h2").textContent = "Не удалось загрузить отчёт";
        empty.querySelector("p").textContent = String(e.message || e);
      }
    }

    function render(data) {
      const items = data.items || [];
      const totalRev = Number(data.total_revenue) || items.reduce((s, i) => s + (Number(i.est_sell_price) || 0), 0);
      const totalProfit = Number(data.total_profit) || items.reduce((s, i) => s + (Number(i.net_profit) || 0), 0);
      const avgMargin = totalRev > 0 ? (totalProfit / totalRev) * 100 : 0;
      const good = items.filter(i => i.is_profitable || (Number(i.margin_pct) || 0) >= 5).length;
      const bad = items.length - good;

      const root = document.getElementById("content");
      root.innerHTML = `
        <div class="header">
          <div>
            <h1>Отчёт по партии</h1>
            <p>${escapeHtml(data.filename || "расчёт")} · ${items.length} поз.</p>
          </div>
          <div class="pill">#${data.id || "—"}</div>
        </div>

        <div class="hint-box">
          Сводка: маржа (до налога), чистая прибыль, маржинальность и ROI. Excel — полный разбор с наценкой.
          Полный Excel уже прислал бот — Mini App удобен для быстрого просмотра в Telegram.
        </div>

        <div class="grid">
          <div class="card"><div class="label">Выручка</div><div class="value">${money(totalRev)}</div></div>
          <div class="card"><div class="label">Чистая прибыль</div><div class="value ${totalProfit >= 0 ? "ok" : "bad"}">${money(totalProfit)}</div></div>
          <div class="card"><div class="label">Рентабельность</div><div class="value">${pct(avgMargin)}</div></div>
          <div class="card"><div class="label">В плюсе / в минусе</div><div class="value">${good} / ${bad}</div></div>
        </div>

        <div class="section-title">Маржа по топ-позициям</div>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>

        <div class="section-title">Товары</div>
        <div class="list" id="list"></div>
      `;

      const sorted = items.slice().sort((a, b) => (Number(b.net_profit) || 0) - (Number(a.net_profit) || 0));
      const top = sorted.slice(0, 8);
      const ctx = document.getElementById("chart");
      if (ctx && window.Chart && top.length) {
        new Chart(ctx, {
          type: "bar",
          data: {
            labels: top.map(i => truncate(i.title || "—", 18)),
            datasets: [{
              label: "Маржа %",
              data: top.map(i => Number(i.margin_pct) || 0),
              backgroundColor: top.map(i => {
                const m = Number(i.margin_pct) || 0;
                if (m >= 20) return "rgba(61,214,140,0.75)";
                if (m >= 5) return "rgba(230,180,80,0.75)";
                return "rgba(240,113,120,0.75)";
              }),
              borderRadius: 6,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: "#8b9bb4", maxRotation: 45, font: { size: 10 } }, grid: { display: false } },
              y: { ticks: { color: "#8b9bb4" }, grid: { color: "rgba(255,255,255,0.05)" } },
            },
          },
        });
      }

      const list = document.getElementById("list");
      list.innerHTML = sorted.map(i => {
        const m = Number(i.margin_pct) || 0;
        const profit = Number(i.net_profit) || 0;
        let badge = '<span class="badge bad">риск</span>';
        if (m >= 20) badge = '<span class="badge ok">сильная</span>';
        else if (m >= 5) badge = '<span class="badge warn">норма</span>';
        return `
          <div class="row">
            <div>
              <div class="name">${escapeHtml(i.title || "—")}</div>
              <div class="meta">Закуп ${money(i.buy_price)} · продажа ${money(i.est_sell_price)}</div>
              ${badge}
            </div>
            <div class="metrics">
              <div class="profit" style="color:${profit >= 0 ? "var(--ok)" : "var(--bad)"}">${money(profit)}</div>
              <div class="margin">маржа ${pct(m)} · ROI ${pct(i.roi_pct)}</div>
            </div>
          </div>`;
      }).join("");
    }

    function truncate(s, n) {
      s = String(s || "");
      return s.length > n ? s.slice(0, n - 1) + "…" : s;
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    load();
  </script>
</body>
</html>
