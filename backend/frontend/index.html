<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Marginator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1419);
      --text: var(--tg-theme-text-color, #e7ecf3);
      --hint: var(--tg-theme-hint-color, #8b98a5);
      --btn: var(--tg-theme-button-color, #2aabee);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --sec: var(--tg-theme-secondary-bg-color, #1a2332);
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --line: rgba(127,140,160,.25);
      --radius: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.45;
      overscroll-behavior-y: none;
    }
    body { padding: 12px 14px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
    header.app {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px;
    }
    header.app h1 {
      margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em;
    }
    header.app .sub { color: var(--hint); font-size: 12px; margin-top: 2px; }
    .kpi-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    @media (min-width: 420px) {
      .kpi-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
    }
    .kpi {
      background: var(--sec); border-radius: var(--radius); padding: 10px 12px;
      border: 1px solid var(--line);
    }
    .kpi .label { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: .04em; }
    .kpi .value { font-size: 16px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .search {
      width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--sec); color: var(--text); font-size: 15px; margin-bottom: 10px; outline: none;
    }
    .search:focus { border-color: var(--btn); }
    .filters {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
    }
    .chip {
      border: 1px solid var(--line); background: var(--sec); color: var(--text);
      border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .chip.active { background: var(--btn); color: var(--btn-text); border-color: transparent; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .card {
      background: var(--sec); border-radius: var(--radius); padding: 12px 14px;
      border: 1px solid var(--line);
    }
    .card .title { font-weight: 600; font-size: 14px; margin-bottom: 8px; word-break: break-word; }
    .card .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-top: 4px; }
    .card .row span:first-child { color: var(--hint); }
    .card .profit { font-weight: 700; font-variant-numeric: tabular-nums; }
    .empty, .loader {
      text-align: center; padding: 48px 20px; color: var(--hint);
    }
    .empty .icon { font-size: 42px; margin-bottom: 12px; line-height: 1; }
    .empty h2 { color: var(--text); margin: 0 0 8px; font-size: 17px; font-weight: 700; }
    .empty p { margin: 0; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .loader .spin {
      width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--line);
      border-top-color: var(--btn); border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta { color: var(--hint); font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="loader" class="loader">
    <div class="spin"></div>
    <div>Загрузка расчёта…</div>
  </div>
  <div id="empty" class="empty" style="display:none">
    <div class="icon">📊</div>
    <h2>Нет данных</h2>
    <p id="empty-text">Откройте мини-приложение кнопкой из сообщения бота после расчёта.</p>
  </div>
  <div id="content" style="display:none">
    <header class="app">
      <div>
        <h1>Marginator</h1>
        <div class="sub" id="file-label">отчёт</div>
      </div>
    </header>
    <div class="kpi-grid" id="kpi"></div>
    <input class="search" id="search" type="search" placeholder="Поиск по названию…" autocomplete="off" />
    <div class="filters">
      <button type="button" class="chip active" data-filter="all">Все</button>
      <button type="button" class="chip" data-filter="ok">В плюсе</button>
      <button type="button" class="chip" data-filter="risk">Риск</button>
      <button type="button" class="chip" data-filter="top">Топ-20</button>
      <button type="button" class="chip" data-filter="roi">ROI топ</button>
    </div>
    <div class="meta" id="count"></div>
    <div class="list" id="list"></div>
  </div>
<script>

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      try { tg.ready(); } catch (e) {}
      try { tg.expand(); } catch (e) {}
      try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    }

    let ALL_ITEMS = [];
    let FILTER = "all";
    let QUERY = "";
    let chartObj = null;

    function money(n) {
      const x = Number(n) || 0;
      return x.toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " ₽";
    }
    function pct(n) {
      const x = Number(n);
      if (isNaN(x)) return "—";
      return x.toFixed(1) + "%";
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function getUploadId() {
      const q = new URLSearchParams(location.search);
      if (q.get("upload_id")) return q.get("upload_id");
      if (q.get("id")) return q.get("id");
      try {
        const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
        if (h.get("upload_id")) return h.get("upload_id");
      } catch (e) {}
      try {
        const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
        if (!sp) return null;
        if (/^\d+$/.test(String(sp))) return String(sp);
        const m = String(sp).match(/(\d+)/);
        if (m) return m[1];
      } catch (e) {}
      return null;
    }

    function filteredItems() {
      let items = ALL_ITEMS.slice();
      if (FILTER === "ok") {
        items = items.filter(i => Number(i.margin_pct) >= 5 || i.is_profitable);
      }
      if (FILTER === "risk") {
        items = items.filter(i => Number(i.margin_pct) < 5);
      }
      if (FILTER === "roi") {
        items = items.slice().sort((a, b) => Number(b.roi_pct) - Number(a.roi_pct)).slice(0, 20);
      }
      if (FILTER === "top") {
        items = items
          .slice()
          .sort((a, b) => Number(b.net_profit) - Number(a.net_profit))
          .slice(0, 20);
      }
      if (QUERY) {
        const q = QUERY.toLowerCase();
        items = items.filter(i => String(i.title || "").toLowerCase().includes(q));
      }
      return items;
    }

    function badge(m) {
      const v = Number(m);
      if (v >= 20) return '<span class="badge ok">высокая</span>';
      if (v >= 5) return '<span class="badge warn">средняя</span>';
      return '<span class="badge bad">риск</span>';
    }

    function renderList() {
      const items = filteredItems();
      document.getElementById("list-count").textContent = "(" + items.length + ")";
      const list = document.getElementById("list");
      if (!items.length) {
        list.innerHTML = '<div class="row"><div class="meta">Нет позиций по фильтру</div></div>';
        return;
      }
      list.innerHTML = items.map(i => {
        const profit = Number(i.net_profit) || 0;
        const cls = profit >= 0 ? "ok" : "bad";
        return (
          '<div class="row">' +
            '<div><div class="name">' + escapeHtml(i.title || "—") + '</div>' +
            '<div class="meta">закуп ' + money(i.buy_price) +
            ' · прод. ' + money(i.est_sell_price) + '</div>' +
            badge(i.margin_pct) + '</div>' +
            '<div class="metrics">' +
              '<div class="profit" style="color:var(--' + cls + ')">' + money(profit) + '</div>' +
              '<div class="margin">маржа ' + pct(i.margin_pct) +
              ' · ROI ' + pct(i.roi_pct) + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join("");
    }

    function renderChart(items) {
      const top = items
        .slice()
        .sort((a, b) => Number(b.margin_pct) - Number(a.margin_pct))
        .slice(0, 12);
      const labels = top.map(i => (i.title || "").slice(0, 18));
      const values = top.map(i => Number(i.margin_pct) || 0);
      const colors = values.map(v =>
        v >= 20 ? "#3dd68c" : v >= 5 ? "#e6b450" : "#f07178"
      );
      const ctx = document.getElementById("chart");
      if (!ctx || typeof Chart === "undefined") return;
      if (chartObj) chartObj.destroy();
      chartObj = new Chart(ctx, {
        type: "bar",
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: colors, borderRadius: 6 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: {
              ticks: { color: "#8b9bb4", maxRotation: 45, font: { size: 10 } },
              grid: { display: false }
            },
            y: {
              ticks: { color: "#8b9bb4" },
              grid: { color: "rgba(255,255,255,0.06)" }
            }
          }
        }
      });
    }

    function render(data) {
      ALL_ITEMS = data.items || [];
      const rev = Number(data.total_revenue) || 0;
      const prof = Number(data.total_profit) || 0;
      const avg = ALL_ITEMS.length
        ? ALL_ITEMS.reduce((s, i) => s + (Number(i.margin_pct) || 0), 0) / ALL_ITEMS.length
        : 0;
      const risk = ALL_ITEMS.filter(i => Number(i.margin_pct) < 5).length;

      document.getElementById("title").textContent = data.filename || ("Отчёт #" + (data.id || ""));
      document.getElementById("subtitle").textContent = ALL_ITEMS.length + " позиций";
      document.getElementById("kpi").innerHTML =
        '<div class="card"><div class="label">Выручка</div><div class="value">' + money(rev) + '</div></div>' +
        '<div class="card"><div class="label">Чистая прибыль</div><div class="value ' +
        (prof >= 0 ? "ok" : "bad") + '">' + money(prof) + '</div></div>' +
        '<div class="card"><div class="label">Ср. маржинальность</div><div class="value">' + pct(avg) + '</div></div>' +
        '<div class="card"><div class="label">В зоне риска</div><div class="value ' +
        (risk ? "bad" : "ok") + '">' + risk + '</div></div>';

      renderChart(ALL_ITEMS);
      renderList();
    }

    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        FILTER = btn.getAttribute("data-filter");
        renderList();
      });
    });
    document.getElementById("search").addEventListener("input", (e) => {
      QUERY = e.target.value || "";
      renderList();
    });
    document.getElementById("btn-close").addEventListener("click", () => {
      if (tg) tg.close();
    });

    async function load() {
      const uploadId = getUploadId();
      const loader = document.getElementById("loader");
      const empty = document.getElementById("empty");
      const content = document.getElementById("content");

      if (!uploadId) {
        loader.style.display = "none";
        empty.style.display = "block";
        document.getElementById("empty-text").textContent =
          "Нет ID расчёта.\nОткройте Mini App кнопкой из сообщения бота после расчёта.\nWEB_APP_URL должен заканчиваться на /app";
        return;
      }

      try {
        const headers = { "Accept": "application/json" };
        if (tg && tg.initData) {
          headers["X-Telegram-Init-Data"] = tg.initData;
        } else {
          throw new Error(
            "Нет initData — откройте только из Telegram, кнопкой из бота (не из браузера)."
          );
        }

        const url = location.origin + "/api/upload/" + encodeURIComponent(uploadId);
        const res = await fetch(url, { headers, credentials: "same-origin" });

        let detail = "";
        try {
          const body = await res.clone().json();
          detail = body.detail || body.message || JSON.stringify(body);
        } catch (e) {
          try { detail = await res.text(); } catch (e2) { detail = ""; }
        }

        if (!res.ok) {
          throw new Error("HTTP " + res.status + (detail ? ": " + detail : ""));
        }

        const data = await res.json();
        loader.style.display = "none";
        content.style.display = "block";
        render(data);
      } catch (e) {
        loader.style.display = "none";
        empty.style.display = "block";
        document.getElementById("empty-text").textContent = String(e.message || e);
      }
    }

    load();
  
</script>
</body>
</html>
