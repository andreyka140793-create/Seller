<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginator — Отчёт</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 12px; color: #f8fafc; }
  .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: #334155; border-radius: 8px; padding: 12px; text-align: center; }
  .stat-value { font-size: 22px; font-weight: 700; color: #34d399; }
  .stat-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #334155; }
  th { background: #064e3b; color: #fff; position: sticky; top: 0; }
  tr:hover { background: #1e293b; }
  .green { color: #34d399; }
  .red { color: #f87171; }
  .yellow { color: #fbbf24; }
  .loader { text-align: center; padding: 40px; color: #94a3b8; }
  .error { background: #7f1d1d; color: #fecaca; padding: 16px; border-radius: 8px; }
</style>
</head>
<body>
<h1>📊 Marginator — Отчёт</h1>
<div id="app"><div class="loader">Загрузка...</div></div>
<script>
const params = new URLSearchParams(window.location.search);
const uploadId = params.get("upload_id");
const app = document.getElementById("app");

function fmt(n) {
  if (n === null || n === undefined) return "—";
  return Number(n).toLocaleString("ru-RU", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s === null || s === undefined ? "" : String(s);
  return div.innerHTML;
}

function render(data) {
  const items = data.items || [];
  const totalRev = items.reduce((s, i) => s + (i.est_sell_price || 0), 0);
  const totalProfit = items.reduce((s, i) => s + (i.net_profit || 0), 0);
  const profitable = items.filter(i => i.is_profitable).length;

  app.innerHTML = `
    <div class="card">
      <div class="grid">
        <div class="stat"><div class="stat-value">${items.length}</div><div class="stat-label">Позиций</div></div>
        <div class="stat"><div class="stat-value">${fmt(totalRev)}</div><div class="stat-label">Выручка, ₽</div></div>
        <div class="stat"><div class="stat-value">${fmt(totalProfit)}</div><div class="stat-label">Прибыль, ₽</div></div>
        <div class="stat"><div class="stat-value">${profitable}</div><div class="stat-label">К закупке</div></div>
      </div>
    </div>
    <div class="card" style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Товар</th>
            <th>Себест.</th>
            <th>Выручка</th>
            <th>Маржа %</th>
            <th>ROI %</th>
            <th>Прибыль</th>
          </tr>
        </thead>
        <tbody>
          ${items.map(i => {
            const cls = i.margin_pct >= 20 ? "green" : i.margin_pct >= 5 ? "yellow" : "red";
            return `<tr>
              <td>${escapeHtml(i.title)}</td>
              <td>${fmt(i.buy_price)}</td>
              <td>${fmt(i.est_sell_price)}</td>
              <td class="${cls}">${fmt(i.margin_pct)}%</td>
              <td class="${cls}">${fmt(i.roi_pct)}%</td>
              <td class="${cls}">${fmt(i.net_profit)}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

async function load() {
  if (!uploadId) {
    app.innerHTML = '<div class="error">Не указан upload_id</div>';
    return;
  }
  try {
    const initData = window.Telegram?.WebApp?.initData || "";
    const resp = await fetch(`/api/upload/${uploadId}`, {
      headers: { "X-Telegram-Init-Data": initData }
    });
    if (!resp.ok) throw new Error(resp.statusText);
    render(await resp.json());
  } catch (e) {
    app.innerHTML = `<div class="error">Ошибка загрузки: ${escapeHtml(e.message)}</div>`;
  }
}

if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
load();
</script>
</body>
</html>
