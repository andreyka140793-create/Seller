<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Marginator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1419);
      --text: var(--tg-theme-text-color, #e7ecf3);
      --hint: var(--tg-theme-hint-color, #8b98a5);
      --btn: var(--tg-theme-button-color, #2aabee);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --sec: var(--tg-theme-secondary-bg-color, #1a2332);
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --line: rgba(127,140,160,.25);
      --radius: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.45;
      overscroll-behavior-y: none;
    }
    body { padding: 12px 14px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
    header.app { margin-bottom: 12px; }
    header.app h1 { margin: 0; font-size: 18px; font-weight: 700; }
    header.app .sub { color: var(--hint); font-size: 12px; margin-top: 2px; }
    .kpi-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    @media (min-width: 420px) {
      .kpi-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
    }
    .kpi {
      background: var(--sec); border-radius: var(--radius); padding: 10px 12px;
      border: 1px solid var(--line);
    }
    .kpi .label { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: .03em; }
    .kpi .value { font-size: 16px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .kpi .value.ok { color: var(--ok); }
    .kpi .value.bad { color: var(--bad); }
    .search {
      width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--sec); color: var(--text); font-size: 15px; margin-bottom: 10px; outline: none;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      border: 1px solid var(--line); background: var(--sec); color: var(--text);
      border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .chip.active { background: var(--btn); color: var(--btn-text); border-color: transparent; }
    .meta { color: var(--hint); font-size: 12px; margin-bottom: 8px; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: flex; justify-content: space-between; gap: 10px;
      background: var(--sec); border-radius: var(--radius); padding: 12px 14px;
      border: 1px solid var(--line);
    }
    .name { font-weight: 600; font-size: 14px; word-break: break-word; }
    .metrics { text-align: right; flex-shrink: 0; }
    .profit { font-weight: 700; font-variant-numeric: tabular-nums; }
    .margin { font-size: 12px; color: var(--hint); margin-top: 2px; }
    .badge {
      display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px;
    }
    .badge.ok { background: rgba(52,211,153,.15); color: var(--ok); }
    .badge.warn { background: rgba(251,191,36,.15); color: var(--warn); }
    .badge.bad { background: rgba(248,113,113,.15); color: var(--bad); }
    .empty, .loader { text-align: center; padding: 48px 20px; color: var(--hint); }
    .empty .icon { font-size: 42px; margin-bottom: 12px; }
    .empty h2 { color: var(--text); margin: 0 0 8px; font-size: 17px; }
    .empty p { margin: 0; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .loader .spin {
      width: 28px; height: 28px; margin: 0 auto 12px;
      border: 3px solid var(--line); border-top-color: var(--btn);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader" class="loader">
    <div class="spin"></div>
    <div>Загрузка расчёта…</div>
  </div>
  <div id="empty" class="empty" style="display:none">
    <div class="icon">📊</div>
    <h2>Нет данных</h2>
    <p id="empty-text">Откройте мини-приложение кнопкой из сообщения бота после расчёта.</p>
  </div>
  <div id="content" style="display:none">
    <header class="app">
      <h1>Marginator</h1>
      <div class="sub" id="file-label">отчёт</div>
    </header>
    <div class="kpi-grid" id="kpi"></div>
    <input class="search" id="search" type="search" placeholder="Поиск по названию…" autocomplete="off" />
    <div class="filters">
      <button type="button" class="chip active" data-filter="all">Все</button>
      <button type="button" class="chip" data-filter="ok">В плюсе</button>
      <button type="button" class="chip" data-filter="risk">Риск</button>
      <button type="button" class="chip" data-filter="top">Топ-20</button>
      <button type="button" class="chip" data-filter="roi">ROI топ</button>
    </div>
    <div class="meta" id="list-count"></div>
    <div class="list" id="list"></div>
  </div>
<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  }

  let ALL_ITEMS = [];
  let FILTER = "all";
  let QUERY = "";

  function money(n) {
    const x = Number(n) || 0;
    return x.toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " ₽";
  }
  function pct(n) {
    const x = Number(n);
    if (isNaN(x)) return "—";
    return x.toFixed(1) + "%";
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function getUploadId() {
    try {
      const q = new URLSearchParams(location.search);
      if (q.get("upload_id")) return q.get("upload_id");
      if (q.get("id")) return q.get("id");
    } catch (e) {}
    try {
      const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
      if (h.get("upload_id")) return h.get("upload_id");
    } catch (e) {}
    try {
      const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      if (sp) {
        if (/^\d+$/.test(String(sp))) return String(sp);
        const m = String(sp).match(/(\d+)/);
        if (m) return m[1];
      }
    } catch (e) {}
    return null;
  }

  function filteredItems() {
    let items = ALL_ITEMS.slice();
    if (FILTER === "ok") {
      items = items.filter(function (i) {
        return Number(i.margin_pct) >= 5 || i.is_profitable;
      });
    }
    if (FILTER === "risk") {
      items = items.filter(function (i) { return Number(i.margin_pct) < 5; });
    }
    if (FILTER === "roi") {
      items = items.slice().sort(function (a, b) {
        return Number(b.roi_pct) - Number(a.roi_pct);
      }).slice(0, 20);
    }
    if (FILTER === "top") {
      items = items.slice().sort(function (a, b) {
        return Number(b.net_profit) - Number(a.net_profit);
      }).slice(0, 20);
    }
    if (QUERY) {
      var q = QUERY.toLowerCase();
      items = items.filter(function (i) {
        return String(i.title || "").toLowerCase().indexOf(q) >= 0;
      });
    }
    return items;
  }

  function badge(m) {
    var v = Number(m);
    if (v >= 20) return '<span class="badge ok">высокая</span>';
    if (v >= 5) return '<span class="badge warn">средняя</span>';
    return '<span class="badge bad">риск</span>';
  }

  function renderList() {
    var items = filteredItems();
    var countEl = document.getElementById("list-count");
    if (countEl) countEl.textContent = "Показано: " + items.length + " из " + ALL_ITEMS.length;
    var list = document.getElementById("list");
    if (!list) return;
    if (!items.length) {
      list.innerHTML = '<div class="meta">Нет позиций по фильтру</div>';
      return;
    }
    list.innerHTML = items.map(function (i) {
      var profit = Number(i.net_profit) || 0;
      var cls = profit >= 0 ? "ok" : "bad";
      return (
        '<div class="row">' +
          '<div>' +
            '<div class="name">' + escapeHtml(i.title || "—") + '</div>' +
            '<div class="meta">закуп ' + money(i.buy_price) +
            ' · прод. ' + money(i.est_sell_price) + '</div>' +
            badge(i.margin_pct) +
          '</div>' +
          '<div class="metrics">' +
            '<div class="profit" style="color:var(--' + cls + ')">' + money(profit) + '</div>' +
            '<div class="margin">маржа ' + pct(i.margin_pct) +
            ' · ROI ' + pct(i.roi_pct) + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function render(data) {
    ALL_ITEMS = (data && data.items) ? data.items : [];
    var label = document.getElementById("file-label");
    if (label) label.textContent = (data && data.filename) ? data.filename : "отчёт #" + (data && data.id ? data.id : "");

    var totalRev = Number(data && data.total_revenue) || 0;
    var totalProfit = Number(data && data.total_profit) || 0;
    if (!totalRev && ALL_ITEMS.length) {
      totalRev = ALL_ITEMS.reduce(function (s, i) { return s + (Number(i.est_sell_price) || 0); }, 0);
    }
    if (!totalProfit && ALL_ITEMS.length) {
      totalProfit = ALL_ITEMS.reduce(function (s, i) { return s + (Number(i.net_profit) || 0); }, 0);
    }
    var risk = ALL_ITEMS.filter(function (i) { return Number(i.margin_pct) < 5; }).length;
    var kpi = document.getElementById("kpi");
    if (kpi) {
      kpi.innerHTML =
        '<div class="kpi"><div class="label">Позиций</div><div class="value">' + ALL_ITEMS.length + '</div></div>' +
        '<div class="kpi"><div class="label">Выручка</div><div class="value">' + money(totalRev) + '</div></div>' +
        '<div class="kpi"><div class="label">Прибыль</div><div class="value ' + (totalProfit >= 0 ? "ok" : "bad") + '">' + money(totalProfit) + '</div></div>' +
        '<div class="kpi"><div class="label">Риск</div><div class="value ' + (risk ? "bad" : "ok") + '">' + risk + '</div></div>';
    }
    renderList();
  }

  document.querySelectorAll(".chip").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".chip").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      FILTER = btn.getAttribute("data-filter") || "all";
      renderList();
    });
  });
  var search = document.getElementById("search");
  if (search) {
    search.addEventListener("input", function (e) {
      QUERY = e.target.value || "";
      renderList();
    });
  }

  async function load() {
    var uploadId = getUploadId();
    var loader = document.getElementById("loader");
    var empty = document.getElementById("empty");
    var content = document.getElementById("content");

    if (!uploadId) {
      if (loader) loader.style.display = "none";
      if (empty) empty.style.display = "block";
      var et = document.getElementById("empty-text");
      if (et) et.textContent =
        "Нет ID расчёта.\nОткройте Mini App кнопкой из сообщения бота после расчёта.\nВ WEB_APP_URL должен быть путь /app?upload_id=…";
      return;
    }

    try {
      var headers = { "Accept": "application/json" };
      if (tg && tg.initData) {
        headers["X-Telegram-Init-Data"] = tg.initData;
      } else {
        throw new Error("Нет initData — откройте только из Telegram, кнопкой в боте (не из браузера).");
      }

      var url = location.origin + "/api/upload/" + encodeURIComponent(uploadId);
      var res = await fetch(url, { headers: headers, credentials: "same-origin" });

      var detail = "";
      try {
        var body = await res.clone().json();
        detail = body.detail || body.message || "";
        if (typeof detail !== "string") detail = JSON.stringify(detail);
      } catch (e) {
        try { detail = await res.text(); } catch (e2) { detail = ""; }
      }

      if (!res.ok) {
        throw new Error("HTTP " + res.status + (detail ? ": " + detail : ""));
      }

      var data = await res.json();
      if (loader) loader.style.display = "none";
      if (content) content.style.display = "block";
      render(data);
    } catch (e) {
      if (loader) loader.style.display = "none";
      if (empty) empty.style.display = "block";
      var et2 = document.getElementById("empty-text");
      if (et2) et2.textContent = String(e.message || e);
    }
  }

  load();
})();
</script>
</body>
</html>
