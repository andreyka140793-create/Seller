version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trade_agent_db
    restart: always
    environment:
      POSTGRES_DB: trade_agent
      POSTGRES_USER: postgres
      # Пароль берётся из .env (переменная POSTGRES_PASSWORD), в репозитории не хранится.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade_agent_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}@db:5432/trade_agent
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - XAI_API_KEY=${XAI_API_KEY}
      - GROK_MODEL=${GROK_MODEL:-grok-4.6}
      - LLM_PROVIDER=${LLM_PROVIDER:-grok}
      - WEB_APP_URL=${WEB_APP_URL}
    volumes:
      # Локальный аналог /data на Amvera: SQLite-фолбэк и временные прайс-листы
      - app_data:/data
    depends_on:
      - db

volumes:
  postgres_data:
  app_data:
